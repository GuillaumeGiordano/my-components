<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				var d = document.documentElement, dark;
				try {
					var mode = localStorage.getItem('theme');
					if (mode) dark = mode === 'dark';
				} catch (e) {}
				if (dark == null) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (dark) d.classList.add('dark');
				try {
					var cls = localStorage.getItem('theme-classes');
					if (cls) cls.split(' ').forEach(function (c) { if (c) d.classList.add(c); });
					var vars = JSON.parse(localStorage.getItem('theme-vars') || 'null');
					if (vars) vars.forEach(function (v) { d.style.setProperty(v[0], v[1]); });
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
